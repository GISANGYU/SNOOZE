<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" stroke-linecap="round" stroke-linejoin="round"><title >S08 등을 돌리면 좌우가 뒤바뀜</title><desc >대표 프레임: 비교 다이어그램 완성 상태.
- 왼쪽 끝 x=180에 KINECT_SIDE가 오른쪽을 본다. blue 시야선 2개(점선)가 화면 끝까지.
- 가운데 왼쪽 x=700에 SKELETON(정면). 왼손 옆 &quot;L&quot;, 오른손 옆 &quot;R&quot;(mono, blue).
- 두 뼈대 사이 x=960 위쪽에 수직축 둘레를 도는 타원 화살표(180°, line-2).
- 오른쪽 x=1220에 SKELETON(뒷모습, line 색). 같은 자리에 red 점선 복제 뼈대가 30px 옆으로 어긋나 겹쳐 있다.
- 오른쪽 뼈대의 L/R 라벨은 red, 서로 자리를 바꾸는 X자 교차 화살표로 이어짐.</desc><defs ><symbol id="KINECT_SIDE" overflow="visible"><rect x="-32" y="-9" width="64" height="18" rx="9" fill="none" stroke="currentColor" stroke-width="2"></rect><circle cx="-14" cy="0" r="4" fill="none" stroke="currentColor" stroke-width="2"></circle><circle cx="14" cy="0" r="4" fill="none" stroke="currentColor" stroke-width="2"></circle><line x1="0" y1="9" x2="0" y2="33" stroke="currentColor" stroke-width="2"></line><line x1="-12" y1="33" x2="12" y2="33" stroke="currentColor" stroke-width="2"></line></symbol><symbol id="KINECT_TOP" overflow="visible"><rect x="-20" y="-6" width="40" height="12" rx="6" fill="#0B0C0E" stroke="currentColor" stroke-width="2"></rect><polygon points="-5,-14 0,-22 5,-14" stroke="currentColor" stroke-width="1" fill="currentColor"></polygon></symbol><symbol id="PC" overflow="visible"><rect x="-22" y="-32" width="44" height="64" rx="4" fill="#0B0C0E" stroke="currentColor" stroke-width="2"></rect><line x1="-10" y1="-17" x2="10" y2="-17" stroke="currentColor" stroke-width="2"></line><line x1="-10" y1="-10" x2="10" y2="-10" stroke="currentColor" stroke-width="2"></line><circle cx="0" cy="20" r="3" fill="none" stroke="currentColor" stroke-width="2"></circle></symbol><symbol id="PROJECTOR" overflow="visible"><rect x="-28" y="-16" width="56" height="32" rx="4" fill="#0B0C0E" stroke="currentColor" stroke-width="2"></rect><circle cx="13" cy="0" r="9" fill="none" stroke="currentColor" stroke-width="2"></circle><line x1="-17" y1="-5" x2="-8" y2="-5" stroke="currentColor" stroke-width="1"></line><line x1="-17" y1="1" x2="-8" y2="1" stroke="currentColor" stroke-width="1"></line></symbol><symbol id="PERSON_TOP" overflow="visible"><circle cx="0" cy="0" r="10" fill="currentColor" stroke-width="2"></circle><line x1="0" y1="-10" x2="0" y2="-24" stroke="currentColor" stroke-width="2"></line></symbol><symbol id="PERSON_SIDE" overflow="visible"><circle cx="0" cy="-107" r="14" fill="none" stroke="currentColor