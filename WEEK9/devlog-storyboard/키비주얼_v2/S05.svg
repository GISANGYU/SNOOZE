<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" stroke-linecap="round" stroke-linejoin="round"><title >S05 한 장 → 프로젝터 4대</title><desc >대표 프레임: 패킷이 네 갈래로 갈라져 프로젝터에 닿기 직전.
- 왼쪽 x=240 중앙에 NET_ICON(160×90).
- 가로 DATA_FLOW 선이 x=620, 860, 1100의 NODE 3개를 지난다. 노드 안 기호: ① 작은 정육면체 윤곽(장면 엔진) ② 오른쪽 화살표 두 개(전송) ③ 3×3 격자가 살짝 휜 모양(워핑).
- x=1100 뒤에서 선이 4갈래 부드러운 곡선으로 갈라져 x=1500의 PROJECTOR 4대(y=300/460/620/780)에 닿는다. 각 프로젝터 오른쪽으로 짧은 빛 삼각형.
- 프로젝터 왼쪽 아래 mono 라벨 P1~P4.
- 패킷은 각 갈래에 1개씩, 모두 같은 x 위치(동시에 도착한다는 뜻).</desc><defs ><symbol id="KINECT_SIDE" overflow="visible"><rect x="-32" y="-9" width="64" height="18" rx="9" fill="none" stroke="currentColor" stroke-width="2"></rect><circle cx="-14" cy="0" r="4" fill="none" stroke="currentColor" stroke-width="2"></circle><circle cx="14" cy="0" r="4" fill="none" stroke="currentColor" stroke-width="2"></circle><line x1="0" y1="9" x2="0" y2="33" stroke="currentColor" stroke-width="2"></line><line x1="-12" y1="33" x2="12" y2="33" stroke="currentColor" stroke-width="2"></line></symbol><symbol id="KINECT_TOP" overflow="visible"><rect x="-20" y="-6" width="40" height="12" rx="6" fill="#0B0C0E" stroke="currentColor" stroke-width="2"></rect><polygon points="-5,-14 0,-22 5,-14" stroke="currentColor" stroke-width="1" fill="currentColor"></polygon></symbol><symbol id="PC" overflow="visible"><rect x="-22" y="-32" width="44" height="64" rx="4" fill="#0B0C0E" stroke="currentColor" stroke-width="2"></rect><line x1="-10" y1="-17" x2="10" y2="-17" stroke="currentColor" stroke-width="2"></line><line x1="-10" y1="-10" x2="10" y2="-10" stroke="currentColor" stroke-width="2"></line><circle cx="0" cy="20" r="3" fill="none" stroke="currentColor" stroke-width="2"></circle></symbol><symbol id="PROJECTOR" overflow="visible"><rect x="-28" y="-16" width="56" height="32" rx="4" fill="#0B0C0E" stroke="currentColor" stroke-width="2"></rect><circle cx="13" cy="0" r="9" fill="none" stroke="currentColor" stroke-width="2"></circle><line x1="-17" y1="-5" x2="-8" y2="-5" stroke="currentColor" stroke-width="1"></line><line x1="-17" y1="1" x2="-8" y2="1" stroke="currentColor" stroke-width="1"></line></symbol><symbol id="PERSON_TOP" overflow="visible"><circle cx="0" cy="0" r="10" fill="currentColor" stroke-width="2"></circle><line x1="0" y1="-10" x2="0" y2="-24" stroke="currentColor" stroke-width="2"></line></symbol><symbol id="PERSON_SIDE" overflow="visible"><circle cx="0" cy="-107" r="14" fill="none" stroke="currentColor" stroke