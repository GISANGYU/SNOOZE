<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" stroke-linecap="round" stroke-linejoin="round"><title >S09 두 번째 센서와 랜선</title><desc >대표 프레임: 랜선 포물선이 다 그려지고 점이 지나가는 순간.
