<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" stroke-linecap="round" stroke-linejoin="round"><title >S03 벽이 세워지는 방</title><desc >대표 프레임: 정면 벽은 다 섰고, 좌·우 벽이 60°까지 일어선 순간.
- 아이소메트릭 30° 방. 바닥 평행사변형 윤곽 line 2px + 안쪽 격자 hair(바닥 7.2×4를 0.6 간격으로 나눈 선).
- 정면 벽 윤곽 완성. 좌·우 벽은 바닥 모서리를 축으로 60° 기울어진 상태로 윤곽만.
- 좌·우 벽 옆에 회전 방향을 알리는 곡선 화살표(line-2, 점선 &quot;4 6&quot;, 끝 화살촉).
- 뒤쪽(입구) 변은 벽 없이 바닥 선만, 그 바닥 선을 점선으로.
