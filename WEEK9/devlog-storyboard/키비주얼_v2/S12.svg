<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" stroke-linecap="round" stroke-linejoin="round"><title >S12 없는 사람이 생김</title><desc >대표 프레임: 유령 2개가 생겨 카운터가 4가 된 순간.
- 평면도(S09와 같은 방·부채꼴, 부채꼴은 opacity 반으로).
- 실제 사람 2명: PERSON_TOP 2개(x=860,y=520 / x=1080,y=600).
- 각 사람 옆 50px 떨어진 곳에 red 점선 원(r10) 유령, 사람과 유령을 red 1px 실선으로 연결.
- 방 오른쪽 위 빈 곳에 카운터: &quot;2 → 3 → 4&quot;(mono 40px), 2는 line 색, 3·4는 red.
- 글리치: 화면을 가로지르는 띠 3개(높이 40px) 구간에서 도형만 오른쪽으로 12px 밀린 복제(clipPath). 색 번짐 없이 위치 어긋남만.</desc><defs ><symbol id="KINECT_SIDE" overflow="visible"><rect x="-32" y="-9" width="64" height="18" rx="9" fill="none" stroke="currentColor" stroke-width="2"></rect><circle cx="-14" cy="0" r="4" fill="none" stroke="currentColor" stroke-width="2"></circle><circle cx="14" cy="0" r="4" fill="none" stroke="currentColor" stroke-width="2"></circle><line x1="0" y1="9" x2="0" y2="33" stroke="currentColor" stroke-width="2"></line><line x1="-12" y1="33" x2="12" y2="33" stroke="currentColor" stroke-width="2"></line></symbol><symbol id="KINECT_TOP" overflow="visible"><rect x="-20" y="-6" width="40" height="12" rx="6" fill="#0B0C0E" stroke="currentColor" stroke-width="2"></rect><polygon points="-5,-14 0,-22 5,-14" stroke="currentColor" stroke-width="1" fill="currentColor"></polygon></symbol><symbol id="PC" overflow="visible"><rect x="-22" y="-32" width="44" height="64" rx="4" fill="#0B0C0E" stroke="currentColor" stroke-width="2"></rect><line x1="-10" y1="-17" x2="10" y2="-17" stroke="currentColor" stroke-width="2"></line><line x1="-10" y1="-10" x2="10" y2="-10" stroke="currentColor" stroke-width="2"></line><circle cx="0" cy="20" r="3" fill="none" stroke="currentColor" stroke-width="2"></circle></symbol><symbol id="PROJECTOR" overflow="visible"><rect x="-28" y="-16" width="56" height="32" rx="4" fill="#0B0C0E" stroke="currentColor" stroke-width="2"></rect><circle cx="13" cy="0" r="9" fill="none" stroke="currentColor" stroke-width="2"></circle><line x1="-17" y1="-5" x2="-8" y2="-5" stroke="currentColor" stroke-width="1"></line><line x1="-17" y1="1" x2="-8" y2="1" stroke="currentColor" stroke-width="1"></line></symbol><symbol id="PERSON_TOP" overflow="visible"><circle cx="0" cy="0" r="10" fill="currentColor" stroke-width="2"></circle><line x1="0" y1="-10" x2="0" y2="-24" stroke="currentColor" stroke-width="2"></line></symbol><symbol id="PERSON_SIDE" overflow="visible"><circle cx="0" cy="-107" r="1