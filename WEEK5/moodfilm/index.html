<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LIMEN 무드 필름</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#030409; --ink:#E8ECF4; --mute:#8C93A3; --line:rgba(255,255,255,.12); --glass:rgba(10,12,20,.72); --accent:#9FB8FF; --accent-ink:#060814; --rec:#FF5A5A;
  --sans:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 var(--sans);overflow:hidden}
button,select{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,.seg:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#stage{position:fixed;inset:0}
#gl{display:block;width:100%;height:100%;touch-action:none}
#sheetWrap{position:absolute;inset:0;display:grid;place-items:center;padding:72px 16px 96px;background:#000}
#sheetBox{position:relative;width:min(100%,calc((100vh - 170px) * 20 / 10.5));aspect-ratio:20/10.5}
#sheetBox canvas{width:100%;height:100%;display:block}
.slab{position:absolute;font-family:var(--mono);font-size:10.5px;color:rgba(255,255,255,.55);letter-spacing:.08em;pointer-events:none}
.sdiv{position:absolute;top:0;height:42.857%;border-left:1px dashed rgba(255,255,255,.18)}
.title{position:absolute;left:16px;top:14px;display:flex;flex-direction:column;gap:3px;pointer-events:none;max-width:min(520px,60vw)}
.title .k{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.12em}
.title .n{font-size:26px;font-weight:300;letter-spacing:-.01em;line-height:1.2}
.title .d{font-size:12.5px;color:#B9BFCC;font-weight:300}
.title .ref{font-size:11.5px;color:var(--mute)}
.tools{position:absolute;right:16px;top:14px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;max-width:60vw}
.seg2{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--glass);backdrop-filter:blur(8px)}
.seg2 button{background:none;border:0;padding:6px 12px;cursor:pointer;font-size:12px;color:var(--mute)}
.seg2 button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pill{background:var(--glass);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:12px}
.pill:hover{border-color:var(--accent)}
.pill.rec{border-color:var(--rec);color:#FFD0D0}
.pill.rec::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--rec);margin-right:6px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
select.pill{appearance:none;padding-right:12px}
.note{position:absolute;right:16px;top:52px;font-size:11.5px;color:var(--mute);text-align:right;max-width:360px;pointer-events:none}
.cams{position:absolute;left:16px;bottom:64px;display:flex;gap:6px;flex-wrap:wrap}
.tl{position:absolute;left:16px;right:16px;bottom:14px;display:flex;align-items:center;gap:10px}
.play{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--glass);cursor:pointer;flex:none}
.time{font-family:var(--mono);font-size:12px;color:#B9BFCC;min-width:96px;font-variant-numeric:tabular-nums}
.bar{position:relative;flex:1;height:32px;display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--glass);backdrop-filter:blur(8px);cursor:pointer}
.seg{position:relative;background:none;border:0;border-right:1px solid var(--line);color:var(--mute);font-size:11px;text-align:left;padding:0 8px;white-space:nowrap;overflow:hidden;cursor:pointer}
.seg:last-of-type{border-right:0}
.seg.on{color:var(--ink);background:rgba(159,184,255,.12)}
.ph{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);box-shadow:0 0 8px var(--accent);pointer-events:none}
label.lp{display:flex;align-items:center;gap:6px;font-size:12px;color:#B9BFCC;white-space:nowrap}
label.lp input{accent-color:var(--accent)}
@media (max-width:760px){
  .title .n{font-size:19px}.title .ref,.note{display:none}
  .seg{font-size:0;padding:0}
  .tools{max-width:70vw}
  label.lp span{display:none}
}
</style>

</head><body>
<div id="stage">
  <canvas id="gl" aria-label="호라이즌 스튜디오 4면 공간에 투사된 LIMEN 무드 필름 3D 미리보기. 드래그로 회전, 휠로 확대"></canvas>
  <div id="sheetWrap" hidden>
    <div id="sheetBox">
      <div class="sdiv" style="left:30%"></div><div class="sdiv" style="left:70%"></div>
      <span class="slab" style="left:1%;top:1.5%">LEFT · 6×4.5m</span>
      <span class="slab" style="left:31%;top:1.5%">FRONT · 8×4.5m</span>
      <span class="slab" style="left:71%;top:1.5%">RIGHT · 6×4.5m</span>
      <span class="slab" style="left:31%;top:44.5%">FLOOR · 8×6m</span>
    </div>
  </div>

  <div class="title">
    <span class="k" id="tk">LIMEN · MOOD FILM · 01</span>
    <span class="n" id="tn">개미 → 블랙홀</span>
    <span class="d" id="td"></span>
    <span class="ref" id="tr"></span>
  </div>

  <div class="tools">
    <div class="seg2" role="group" aria-label="보기">
      <button id="v3d" aria-pressed="true">3D 공간</button>
      <button id="vsheet" aria-pressed="false">전개도</button>
    </div>
    <select class="pill" id="q" aria-label="해상도">
      <option value="72">가볍게 · 1440×756</option>
      <option value="96" selected>기본 · 1920×1008</option>
      <option value="128">고화질 · 2560×1344</option>
    </select>
    <button class="pill" id="recFull">처음부터 3분 녹화</button>
    <button class="pill" id="rec">지금부터 녹화</button>
  </div>
  <div class="note" id="note">녹화는 전개도(좌·정면·우 벽 + 바닥) 한 장을 webm 으로 저장합니다. 녹화 중에는 이 탭을 앞에 띄워 두세요.</div>

  <div class="cams" id="cams">
    <button class="pill" data-cam="viewer">관객 시점</button>
    <button class="pill" data-cam="inside">안에서</button>
    <button class="pill" data-cam="corner">코너</button>
    <button class="pill" data-cam="top">탑뷰</button>
    <label class="lp pill"><input type="checkbox" id="figs"> <span>사람 크기 참고</span></label>
  </div>

  <div class="tl">
    <button class="play" id="play" aria-label="일시정지">❚❚</button>
    <span class="time" id="time">00:00 / 03:00</span>
    <div class="bar" id="bar"><div class="ph" id="ph"></div></div>
    <label class="lp"><input type="checkbox" id="loop"> <span>이 장면 반복</span></label>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
'use strict';
if(!window.THREE){document.getElementById('td').textContent='three.js 를 불러오지 못했습니다. 인터넷 연결을 확인하세요.';return;}

/* ───────── 공간 (m) ───────── */
const W=8,D=6,H=4.5,S=D+W+D,TOTAL=180,TAU=Math.PI*2;
const BH={s:D+W/2,y:2.05};
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const rnd=(a,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const angD=(a,b)=>{let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;};
const fmt=s=>{s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');};
function seeded(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hsh(i,j){let n=Math.imul(i,374761393)+Math.imul(j,668265263)|0;n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967295;}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);return lerp(lerp(hsh(xi,yi),hsh(xi+1,yi),u),lerp(hsh(xi,yi+1),hsh(xi+1,yi+1),u),v);}
const flowA=(x,y,t)=>(vnoise(x*.33+t*.03,y*.33-t*.02)*2+vnoise(x*.9,y*.9+t*.05)*.6)*TAU;

/* ───────── 캔버스 파이프라인 ───────── */
// 각 면: acc(장면이 잔상과 함께 그려짐) → out(acc + 블룸 + 결) → three 텍스처
let PPM=96;
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c;};
const SURF={strip:{w:S,h:H},floor:{w:W,h:D}};
function allocSurf(o){o.acc=mk(o.w*PPM,o.h*PPM);o.out=mk(o.w*PPM,o.h*PPM);o.b1=mk(o.acc.width/4,o.acc.height/4);o.b1b=mk(o.b1.width,o.b1.height);o.b2=mk(o.acc.width/10,o.acc.height/10);o.b2b=mk(o.b2.width,o.b2.height);
  ['acc','out','b1','b1b','b2','b2b'].forEach(k=>o[k+'X']=o[k].getContext('2d'));o.accX.fillStyle='#000';o.accX.fillRect(0,0,o.acc.width,o.acc.height);}
const grain=(()=>{const c=mk(160,160),x=c.getContext('2d'),d=x.createImageData(160,160);for(let i=0;i<d.data.length;i+=4){const v=128+(Math.random()-.5)*90;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}x.putImageData(d,0,0);return c;})();
const SPR={};function spr(r,g,b,soft){const k=r+','+g+','+b+','+(soft?1:0);if(SPR[k])return SPR[k];const c=mk(64,64),x=c.getContext('2d'),gr=x.createRadialGradient(32,32,0,32,32,32);
  if(soft){gr.addColorStop(0,`rgba(${r},${g},${b},.5)`);gr.addColorStop(.5,`rgba(${r},${g},${b},.18)`);gr.addColorStop(1,`rgba(${r},${g},${b},0)`);}
  else{gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.12,`rgba(${r},${g},${b},.95)`);gr.addColorStop(.4,`rgba(${r},${g},${b},.25)`);gr.addColorStop(1,`rgba(${r},${g},${b},0)`);}
  x.fillStyle=gr;x.fillRect(0,0,64,64);return SPR[k]=c;}
const ICE=spr(170,200,255),GOLD=spr(255,196,110),CYAN=spr(120,230,255),VIO=spr(170,140,255),PINK=spr(255,160,200),WHITE=spr(235,240,255),GREEN=spr(170,255,160);
const HAZE_B=spr(60,90,200,true),HAZE_V=spr(120,70,200,true),HAZE_W=spr(255,190,120,true),HAZE_P=spr(255,120,190,true),HAZE_G=spr(90,200,120,true),HAZE_T=spr(60,180,190,true);

function stripT(x){x.setTransform(PPM,0,0,PPM,0,0);}
function floorT(x){x.setTransform(PPM,0,0,PPM,W/2*PPM,D/2*PPM);}
function idT(x){x.setTransform(1,0,0,1,0,0);}
function fade(x,col,a){idT(x);x.globalCompositeOperation='source-over';x.globalAlpha=a;x.fillStyle=col;x.fillRect(0,0,x.canvas.width,x.canvas.height);x.globalAlpha=1;}
function paint(x,style){idT(x);x.globalAlpha=1;x.fillStyle=style;x.fillRect(0,0,x.canvas.width,x.canvas.height);}
function vgrad(x,stops){idT(x);const g=x.createLinearGradient(0,0,0,x.canvas.height);stops.forEach(s=>g.addColorStop(s[0],s[1]));x.fillStyle=g;x.fillRect(0,0,x.canvas.width,x.canvas.height);}
function glow(x,img,cx,cy,r,a){if(a<=.003)return;x.globalAlpha=Math.min(1,a);x.drawImage(img,cx-r,cy-r,r*2,r*2);}
function veil(x,col,a){if(a<=.002)return;idT(x);x.globalAlpha=Math.min(1,a);x.fillStyle=col;x.fillRect(0,0,x.canvas.width,x.canvas.height);x.globalAlpha=1;}
const FILTER_OK=(()=>{try{const t=mk(2,2).getContext('2d');t.filter='blur(1px)';return t.filter==='blur(1px)';}catch(e){return false;}})();
let BLOOM=1;
function post(o){
  const {accX,outX,b1X,b1bX,b2X,b2bX}=o;
  idT(outX);outX.globalCompositeOperation='source-over';outX.globalAlpha=1;outX.drawImage(o.acc,0,0);
  b1X.globalCompositeOperation='copy';b1X.drawImage(o.acc,0,0,o.b1.width,o.b1.height);
  b2X.globalCompositeOperation='copy';b2X.drawImage(o.b1,0,0,o.b2.width,o.b2.height);
  b1bX.globalCompositeOperation='copy';b2bX.globalCompositeOperation='copy';
  if(FILTER_OK){b1bX.filter='blur(3px)';b2bX.filter='blur(4px)';}
  b1bX.drawImage(o.b1,0,0);b2bX.drawImage(o.b2,0,0);b1bX.filter='none';b2bX.filter='none';
  // 두 블룸을 작은 캔버스에서 먼저 합친 뒤 한 번만 확대해 얹는다 (확대 합성이 가장 비싸다)
  b1bX.globalCompositeOperation='lighter';b1bX.globalAlpha=1.35;b1bX.drawImage(o.b2b,0,0,o.b1.width,o.b1.height);b1bX.globalAlpha=1;b1bX.globalCompositeOperation='source-over';
  outX.imageSmoothingQuality='low';outX.globalCompositeOperation='lighter';outX.globalAlpha=.6*BLOOM;outX.drawImage(o.b1b,0,0,o.out.width,o.out.height);
  outX.globalCompositeOperation='source-over';outX.globalAlpha=1;
}
// 전개도 (녹화용 한 장): 위=좌·정면·우 벽, 아래=정면 아래 바닥
let sheet=mk(S*PPM,(H+D)*PPM),sheetX=sheet.getContext('2d');
function drawSheet(){sheetX.fillStyle='#000';sheetX.fillRect(0,0,sheet.width,sheet.height);sheetX.drawImage(SURF.strip.out,0,0);sheetX.drawImage(SURF.floor.out,D*PPM,H*PPM);}

/* ───────── three.js 공간 ───────── */
const glc=document.getElementById('gl');
const renderer=new THREE.WebGLRenderer({canvas:glc,antialias:true,preserveDrawingBuffer:false});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));renderer.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x05060a);
const cam=new THREE.PerspectiveCamera(52,1,.05,200);
const controls=new THREE.OrbitControls(cam,glc);controls.enableDamping=true;controls.dampingFactor=.07;controls.maxPolarAngle=Math.PI/2-.02;controls.minDistance=1;controls.maxDistance=30;
const CAMS={viewer:{p:[0,2.1,D/2+6.4],t:[0,1.9,-1]},inside:{p:[0,1.6,D/2-.4],t:[0,2,-D/2]},corner:{p:[7.4,5.8,8.2],t:[0,1.4,-.6]},top:{p:[0,15,.01],t:[0,0,0]}};
cam.position.set(...CAMS.viewer.p);controls.target.set(...CAMS.viewer.t);controls.update();
let texStrip,texFloor;const walls=[];let floorMesh;
function makeTex(c){const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=renderer.capabilities.getMaxAnisotropy();t.generateMipmaps=false;t.minFilter=THREE.LinearFilter;return t;}
function wallMesh(w,s0){const g=new THREE.PlaneGeometry(w,H);const uv=g.attributes.uv;for(let i=0;i<uv.count;i++)uv.setX(i,(s0+uv.getX(i)*w)/S);uv.needsUpdate=true;const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({toneMapped:false}));scene.add(m);walls.push(m);return m;}
const wl=wallMesh(D,0);wl.rotation.y=Math.PI/2;wl.position.set(-W/2,H/2,0);
const wf=wallMesh(W,D);wf.position.set(0,H/2,-D/2);
const wr=wallMesh(D,D+W);wr.rotation.y=-Math.PI/2;wr.position.set(W/2,H/2,0);
floorMesh=new THREE.Mesh(new THREE.PlaneGeometry(W,D),new THREE.MeshBasicMaterial({toneMapped:false}));floorMesh.rotation.x=-Math.PI/2;scene.add(floorMesh);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.MeshBasicMaterial({color:0x010102}));ground.rotation.x=-Math.PI/2;ground.position.y=-.01;scene.add(ground);
{const pts=[[-W/2,0,D/2],[-W/2,H,D/2],[-W/2,H,-D/2],[W/2,H,-D/2],[W/2,H,D/2],[W/2,0,D/2]].map(p=>new THREE.Vector3(...p));scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0x1d2029})));}
const figs=new THREE.Group();figs.visible=false;scene.add(figs);
{const m=new THREE.MeshBasicMaterial({color:0x0a0b0f});const mkF=(x,z,h)=>{const g=new THREE.Group();const b=new THREE.Mesh(new THREE.CapsuleGeometry(.17,.55,4,10),m);b.position.y=1.2;b.scale.set(1.1,1,.7);g.add(b);const hd=new THREE.Mesh(new THREE.SphereGeometry(.11,14,10),m);hd.position.y=1.68;g.add(hd);for(const s of[-1,1]){const l=new THREE.Mesh(new THREE.CapsuleGeometry(.07,.72,4,8),m);l.position.set(s*.1,.46,0);g.add(l);}g.scale.setScalar(h/1.78);g.position.set(x,0,z);figs.add(g);};mkF(-1.2,.8,1.75);mkF(.9,1.4,1.62);mkF(.1,-.4,1.8);}
function setQuality(p){PPM=p;allocSurf(SURF.strip);allocSurf(SURF.floor);sheet=mk(S*PPM,(H+D)*PPM);sheetX=sheet.getContext('2d');
  const box=document.getElementById('sheetBox');const old=box.querySelector('canvas');if(old)old.remove();box.prepend(sheet);sheet.setAttribute('aria-label','4면 전개도 출력');
  if(texStrip)texStrip.dispose();if(texFloor)texFloor.dispose();texStrip=makeTex(SURF.strip.out);texFloor=makeTex(SURF.floor.out);walls.forEach(m=>{m.material.map=texStrip;m.material.needsUpdate=true;});floorMesh.material.map=texFloor;floorMesh.material.needsUpdate=true;
  SCN.forEach(s=>s.S.realloc&&s.S.realloc());}

/* ───────── 공용: 빛나는 대시(개미) 묶음 그리기 ───────── */
function dashes(x,arr,len,width,col,alphas,filter){ // arr: {x,y,a,br}
  x.lineCap='round';x.lineWidth=width;x.strokeStyle=col;
  for(let b=0;b<alphas.length;b++){x.globalAlpha=alphas[b];x.beginPath();
    for(let i=b;i<arr.length;i+=alphas.length){const p=arr[i];if(filter&&!filter(p))continue;const l=len*(p.l||1),c=Math.cos(p.a)*l,s=Math.sin(p.a)*l;x.moveTo(p.x-c,p.y-s);x.lineTo(p.x+c,p.y+s);}
    x.stroke();}
  x.globalAlpha=1;}

/* ═══════ 01 개미 → 블랙홀 ═══════ */
const A1=[],F1=[];
const S1={
  enter(){A1.length=0;F1.length=0;
    for(let i=0;i<2300;i++)A1.push({x:rnd(0,S),y:rnd(.1,H-.1),a:rnd(TAU),sp:rnd(.25,.55),m:0,r:0,th:0,l:rnd(.7,1.3)});
    for(let i=0;i<1500;i++)F1.push({x:rnd(-W/2,W/2),y:rnd(-D/2,D/2),a:rnd(TAU),sp:rnd(.2,.45),l:rnd(.7,1.3)});},
  update(dt,lt){const g=.12+.88*sstep(1,14,lt);
    for(const p of A1){
      if(p.m===0){const dx=BH.s-p.x,dy=BH.y-p.y,d=Math.hypot(dx,dy)+1e-6,des=Math.atan2(dy,dx),fa=flowA(p.x,p.y,lt);
        const w=g*(.35+.65*Math.min(1,3.5/d));const tgt=fa+angD(des,fa)*w;p.a+=angD(tgt,p.a)*3.2*dt;
        const v=p.sp*(.5+g*1.6);p.x+=Math.cos(p.a)*v*dt;p.y+=Math.sin(p.a)*v*dt;

    const swA=sstep(18,24,lt)*(FIN.burst?out:1);if(swA>0)dashes(x,FIN.SW,.07,.008,'#AFC4FF',[.35*swA,.6*swA]);
    x.globalCompositeOperation='source-over';
    if(FIN.burst){veil(x,'#FFFFFF',1-sstep(29,30.4,lt));x.globalCompositeOperation='lighter';stripT(x);const r=(lt-29)*3.5;x.lineWidth=.05;x.strokeStyle=`rgba(210,225,255,${Math.max(0,.6-r*.05)})`;x.beginPath();x.ellipse(CHEST.x,CHEST.y,r,r*.8,0,0,TAU);x.stroke();x.globalCompositeOperation='source-over';}
    if(lt>38){stripT(x);x.globalCompositeOperation='lighter';const a=sstep(38,42,lt);x.globalAlpha=a*.5;x.strokeStyle='#DCE6FF';x.lineWidth=.012;x.beginPath();for(let i=0;i<220;i++){const s=(i*7.31)%S,y=(i*1.37)%H,an=Math.atan2(BH.y-y,BH.s-s);x.moveTo(s,y);x.lineTo(s+Math.cos(an)*.06,y+Math.sin(an)*.06);}x.stroke();x.globalAlpha=1;x.globalCompositeOperation='source-over';}},
  floor(x,lt){fade(x,'#000000',FIN.burst?.1:.12);floorT(x);x.globalCompositeOperation='lighter';const out=1-sstep(32,40,lt);
    if(!FIN.burst)glow(x,HAZE_B,0,-D/2,2.4,.5*sstep(14,24,lt));
    dashes(x,FIN.F.filter(p=>p.st>=0),.05,.013,'#EAF0FF',FIN.burst?[.45*out,.7*out]:[.35,.6,.85]);
    x.globalCompositeOperation='source-over';if(FIN.burst){veil(x,'#FFFFFF',.8*(1-sstep(29,30.4,lt)));floorT(x);x.globalCompositeOperation='lighter';for(let k=0;k<4;k++){const r=(lt-29)*2.4-k*.7;if(r<=0)continue;x.lineWidth=.04;x.strokeStyle=`rgba(210,225,255,${Math.max(0,.55-r*.07)})`;x.beginPath();x.arc(0,-D/2,r,0,Math.PI);x.stroke();}x.globalCompositeOperation='source-over';}},
  bloom:1.15
};

/* ───────── 타임라인 ───────── */
const SCN=[
  {n:'개미 → 블랙홀',a:0,b:20,S:S1,d:'어둠 속에서 빛의 선으로 된 개미들이 흔적을 따라 흐르다가, 정면 가운데의 블랙홀로 모여들어 원반이 된다.',r:'무드보드 · "흰 배경에 검정 개미 버리고 블랙홀처럼" / 블랙홀·링 포스터'},
  {n:'터널',a:20,b:38,S:S2,d:'원반이 소용돌이치며 빨려 들어가고, 빛의 잔상이 벽을 따라 늘어나며 특이점의 흰 섬광으로 넘어간다.',r:'무드보드 · 흑백 터널 스트립, 광속 라인'},
  {n:'반딧불이',a:38,b:65,S:S3,d:'푸른 성운 속에서 제각각 반짝이던 빛이, 왼쪽 벽부터 오른쪽으로 하나의 호흡으로 맞춰진 뒤 사라진다.',r:'무드보드 · 스튜디오 목업의 푸른 입자 공간 ("색감은 좋음")'},
  {n:'나비',a:65,b:85,S:S4,d:'남은 하나의 빛이 오른쪽 벽에서 왼쪽 벽으로 건너가고, 빛으로 된 나비가 가루를 흘리며 뒤따른다.',r:'무드보드 · 빛나는 나비 스트립'},
  {n:'전환 · 빛이 퍼지다',a:85,b:93,S:S5,d:'나비가 빛에 닿는 순간 하얗게 번쩍이고, 푸른 입자의 파동이 네 면으로 퍼진다. 깨지는 유리 연출은 뺐다.',r:'무드보드 · "색감은 좋음, 연출을 고민" / "닥터 스트레인지 같아서 이상함"'},
  {n:'거미 · 빛의 그물',a:93,b:118,S:S6,d:'정면 가운데에서 그물이 자라나 벽과 바닥을 잇고, 신호가 줄을 타고 흐른다. 거미는 오른쪽 벽에서 내려온다.',r:'무드보드 · 신경망처럼 빛나는 그물 스트립'},
  {n:'곤충 시점 몽타주',a:118,b:138,S:S7,d:'개미의 황혼 풀숲, 반딧불이의 밤, 나비의 꽃밭, 잠자리의 물가, 물방울 속 세상이 빛이 번지듯 넘어간다.',r:'무드보드 · 꽃과 나비의 몽환 공간 ("전체적으로 좋음")'},
  {n:'피날레 · 개미가 사람이 되다',a:138,b:180,S:S8,d:'검은 공간에 빛의 개미가 하나씩 나타나 모여 사람의 형상이 되고, 가슴에서 빛이 차오르다 "팡" 터진다. 흩어진 빛은 다시 1번 장면으로 흘러간다.',r:'무드보드 · "사람 부분 빼고 개미가 모여 인간이 되고 팡 터지고 1번 씬으로" / 입자 인물 레퍼런스'}
];
let T=0,cur=-1,playing=true,loopOne=false;
const sceneAt=t=>{for(let i=0;i<SCN.length;i++)if(t<SCN[i].b)return i;return SCN.length-1;};
function enter(i){cur=i;SCN[i].S.enter();BLOOM=SCN[i].S.bloom||1;ui();}
function seek(t){T=((t%TOTAL)+TOTAL)%TOTAL;const i=sceneAt(T);if(i===1&&!A1.length)S1.enter();enter(i);}

/* ───────── UI ───────── */
const $=id=>document.getElementById(id),bar=$('bar'),ph=$('ph');
SCN.forEach((s,i)=>{const b=document.createElement('button');b.className='seg';b.id='seg'+i;b.style.width=((s.b-s.a)/TOTAL*100)+'%';b.textContent=String(i+1).padStart(2,'0')+' '+s.n;b.title=s.n+' · '+fmt(s.a)+'–'+fmt(s.b);
  b.addEventListener('click',e=>{if(!e.detail){seek(s.a);return;}const r=bar.getBoundingClientRect();seek(clamp((e.clientX-r.left)/r.width*TOTAL,0,TOTAL-.01));});bar.insertBefore(b,ph);});
function ui(){const s=SCN[cur];SCN.forEach((_,i)=>$('seg'+i).classList.toggle('on',i===cur));$('tk').textContent='LIMEN · MOOD FILM · '+String(cur+1).padStart(2,'0')+' · '+fmt(s.a)+'–'+fmt(s.b);$('tn').textContent=s.n;$('td').textContent=s.d;$('tr').textContent=s.r;}
$('play').addEventListener('click',()=>{playing=!playing;$('play').textContent=playing?'❚❚':'▶';$('play').setAttribute('aria-label',playing?'일시정지':'재생');});
$('loop').addEventListener('change',e=>loopOne=e.target.checked);
$('figs').addEventListener('change',e=>figs.visible=e.target.checked);
let view='3d';function setView(v){view=v;$('v3d').setAttribute('aria-pressed',String(v==='3d'));$('vsheet').setAttribute('aria-pressed',String(v==='sheet'));$('sheetWrap').hidden=v!=='sheet';$('cams').hidden=v!=='3d';}
$('v3d').addEventListener('click',()=>setView('3d'));$('vsheet').addEventListener('click',()=>setView('sheet'));
$('q').addEventListener('change',e=>{if(rec)return;setQuality(+e.target.value);const i=cur;enter(i);});
let camTw=null;document.querySelectorAll('#cams [data-cam]').forEach(b=>b.addEventListener('click',()=>{const c=CAMS[b.dataset.cam];camTw={t:0,p0:cam.position.clone(),t0:controls.target.clone(),p1:new THREE.Vector3(...c.p),t1:new THREE.Vector3(...c.t)};}));

/* ───────── 녹화 (전개도 → webm) ───────── */
let rec=null,recChunks=[],recUntil=null;
function recStart(full){if(rec)return recStop();if(!window.MediaRecorder||!sheet.captureStream){$('note').textContent='이 브라우저는 녹화를 지원하지 않습니다. 크롬에서 열어 주세요.';return;}
  if(full){seek(0);playing=true;$('play').textContent='❚❚';recUntil=TOTAL;}else recUntil=null;
  const mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
  rec=new MediaRecorder(sheet.captureStream(30),{mimeType:mime,videoBitsPerSecond:PPM>=128?28e6:18e6});recChunks=[];rec.startT=T;rec.full=full;
  rec.ondataavailable=e=>{if(e.data.size)recChunks.push(e.data);};
  rec.onstop=()=>{const blob=new Blob(recChunks,{type:'video/webm'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='LIMEN_moodfilm_4면전개도_'+sheet.width+'x'+sheet.height+(rec&&rec.full?'_full':'')+'.webm';document.body.appendChild(a);a.click();a.remove();
    $('note').textContent='저장 요청을 보냈습니다 ('+(blob.size/1048576).toFixed(1)+'MB). 다운로드가 안 보이면 로컬 HTML 파일에서 다시 녹화하세요 — 공유 링크 화면에서는 다운로드가 막힐 수 있습니다.';rec=null;recBtns();};
  rec.start(1000);recBtns();$('note').textContent=full?'3분 전체를 녹화 중입니다. 끝나면 자동으로 저장됩니다. 탭을 앞에 띄워 두세요.':'녹화 중입니다. 다시 누르면 멈추고 저장합니다.';}
function recStop(){if(rec&&rec.state!=='inactive')rec.stop();}
function recBtns(){$('rec').classList.toggle('rec',!!rec&&!rec.full);$('recFull').classList.toggle('rec',!!rec&&rec.full);$('rec').textContent=rec&&!rec.full?'녹화 멈추고 저장':'지금부터 녹화';$('recFull').textContent=rec&&rec.full?'녹화 멈추고 저장':'처음부터 3분 녹화';$('q').disabled=!!rec;}
$('rec').addEventListener('click',()=>recStart(false));$('recFull').addEventListener('click',()=>{if(rec)recStop();else recStart(true);});

/* ───────── 루프 ───────── */
function resize(){const r=document.getElementById('stage').getBoundingClientRect();renderer.setSize(r.width,r.height,false);cam.aspect=r.width/Math.max(1,r.height);cam.updateProjectionMatrix();}
window.addEventListener('resize',resize);resize();
setQuality(96);seek(0);
let last=performance.now(),slow=0,slowT=0;
function frame(now){const raw=(now-last)/1000,rdt=Math.min(.05,raw);last=now;
  if(!document.hidden&&!rec&&raw<1){slow=lerp(slow,raw,.05);slowT+=raw;if(slowT>4&&slow>.048&&PPM>72){const nq=PPM>96?96:72;setQuality(nq);$('q').value=String(nq);enter(cur);$('note').textContent='화면이 버벅여서 해상도를 자동으로 낮췄습니다. 녹화 전에 오른쪽 위에서 다시 고를 수 있습니다.';slow=0;slowT=0;}}
  if(playing){const prev=T;T+=rdt;const s=SCN[cur];
    if(loopOne&&T>=s.b){T=s.a;enter(cur);}
    else{if(T>=TOTAL){T-=TOTAL;if(rec&&recUntil!==null){recStop();}}const i=sceneAt(T);if(i!==cur)enter(i);}}
  const s=SCN[cur],lt=T-s.a,dt=playing?rdt:0;
  s.S.update(dt,lt);
  const st=SURF.strip,fl=SURF.floor;
  st.accX.save();s.S.wall(st.accX,lt);st.accX.restore();fl.accX.save();s.S.floor(fl.accX,lt);fl.accX.restore();
  post(st);post(fl);texStrip.needsUpdate=true;texFloor.needsUpdate=true;
  if(view==='sheet'||rec)drawSheet();
  if(view==='3d'){if(camTw){camTw.t=Math.min(1,camTw.t+rdt/1);const k=sstep(0,1,camTw.t);cam.position.lerpVectors(camTw.p0,camTw.p1,k);controls.target.lerpVectors(camTw.t0,camTw.t1,k);if(camTw.t>=1)camTw=null;}controls.update();renderer.render(scene,cam);}
  $('time').textContent=fmt(T)+' / '+fmt(TOTAL);ph.style.left=(T/TOTAL*100)+'%';
  requestAnimationFrame(frame);}
requestAnimationFrame(frame);
window.__film={seek,get T(){return T;}};
})();
</script>
